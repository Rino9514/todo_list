<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
</head>
<body>
  <header>
    <nav>
      <h1>Todo List</h1>
    </nav>
  </header>

  <div id="content">
    <aside id="sidebar">
      <h2>Projets</h2>
      <ul id="liste-projets"></ul>
      <button id="btn-nouveau-projet">+ Nouveau projet</button>
    </aside>

    <main id="zone-todos">
      <h2 id="titre-projet-actif"></h2>
      <ul id="liste-todos"></ul>
      <button id="btn-nouveau-todo">+ Nouveau todo</button>
    </main>
  </div>

  <!-- Boîte de dialogue réutilisée à la fois pour créer et pour éditer un todo. -->
  <dialog id="dialog-todo">
    <form id="form-todo" method="dialog">
      <input type="hidden" name="id" />

      <label>
        Titre
        <input type="text" name="titre" required />
      </label>

      <label>
        Description
        <textarea name="description"></textarea>
      </label>

      <label>
        Échéance
        <input type="date" name="dateEcheance" />
      </label>

      <label>
        Priorité
        <select name="priorite">
          <option value="basse">Basse</option>
          <option value="moyenne" selected>Moyenne</option>
          <option value="haute">Haute</option>
        </select>
      </label>

      <div class="actions-dialog">
        <button type="submit" value="valider">Enregistrer</button>
        <button type="button" id="btn-annuler-todo">Annuler</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialog-projet">
    <form id="form-projet" method="dialog">
      <label>
        Nom du projet
        <input type="text" name="nom" required />
      </label>

      <div class="actions-dialog">
        <button type="submit" value="valider">Créer</button>
        <button type="button" id="btn-annuler-projet">Annuler</button>
      </div>
    </form>
  </dialog>
</body>
</html>
